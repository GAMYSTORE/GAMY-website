    <style>

        @media (max-width: 900px) {

        @media (max-width: 600px) {

<body>

<header class="header">
    <div class="header-inner">
        <div>
            <div class="logo">
                GAMY <span>STORE</span>
            </div>

            <div class="header-title">
                لوحة إدارة الطلبات
            </div>
        </div>

        <button class="btn btn-danger" onclick="confirmDeleteAll()">
            حذف كل الطلبات
        </button>
    </div>
</header>


<main class="container">

    <!-- Statistics -->

    <section class="stats">

        <div class="stat-card">
            <div class="stat-title">إجمالي الطلبات</div>
            <div class="stat-value" id="totalOrders">0</div>
        </div>

        <div class="stat-card">
            <div class="stat-title">الطلبات الجديدة</div>
            <div class="stat-value" id="newOrders">0</div>
        </div>

        <div class="stat-card">
            <div class="stat-title">طلبات مكتملة</div>
            <div class="stat-value" id="completedOrders">0</div>
        </div>

        <div class="stat-card">
            <div class="stat-title">إجمالي قيمة الطلبات</div>
            <div class="stat-value" id="totalRevenue">0 ج.م</div>
        </div>

    </section>


    <!-- Search / Filter -->

    <section class="toolbar">

        <input
            type="text"
            id="searchInput"
            class="search-box"
            placeholder="ابحث برقم الطلب أو اسم العميل أو رقم الهاتف..."
            oninput="renderOrders()"
        >

        <select
            id="statusFilter"
            class="filter-box"
            onchange="renderOrders()"
        >
            <option value="all">كل الحالات</option>
            <option value="جديد">جديد</option>
            <option value="قيد التجهيز">قيد التجهيز</option>
            <option value="تم الشحن">تم الشحن</option>
            <option value="مكتمل">مكتمل</option>
            <option value="ملغي">ملغي</option>
        </select>

        <button class="btn btn-dark" onclick="renderOrders()">
            تحديث الطلبات
        </button>

    </section>


    <!-- Orders -->

    <section id="ordersContainer" class="orders-container"></section>

</main>


<!-- Confirm Modal -->

<div class="modal-overlay" id="confirmModal">

    <div class="modal">

        <h3 id="modalTitle">تأكيد العملية</h3>

        <p id="modalMessage">
            هل أنت متأكد؟
        </p>

        <div class="modal-actions">

            <button
                class="btn btn-danger"
                id="confirmButton"
            >
                تأكيد
            </button>

            <button
                class="btn btn-light"
                onclick="closeModal()"
            >
                إلغاء
            </button>

        </div>

    </div>

</div>


<script>

    /*
     * ==========================================
     * GAMY STORE - ADMIN ORDERS
     * ==========================================
     *
     * نفس التخزين المستخدم في checkout.html:
     *
     * gamyOrders
     *
     * وآخر طلب:
     *
     * lastGamyOrder
     *
     */


    let orders = [];

    let pendingAction = null;


    /* ==============================
       قراءة الطلبات
    ============================== */

    function loadOrders() {

        try {

            const savedOrders =
                localStorage.getItem("gamyOrders");

            orders = savedOrders
                ? JSON.parse(savedOrders)
                : [];

            if (!Array.isArray(orders)) {
                orders = [];
            }

        } catch (error) {

            console.error(
                "خطأ في قراءة الطلبات:",
                error
            );

            orders = [];
        }

    }


    /* ==============================
       حفظ الطلبات
    ============================== */

    function saveOrders() {

        localStorage.setItem(
            "gamyOrders",
            JSON.stringify(orders)
        );

    }


    /* ==============================
       حماية HTML
    ============================== */

    function escapeHTML(value) {

        if (value === null || value === undefined) {
            return "";
        }

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    /* ==============================
       تنسيق السعر
    ============================== */

    function formatPrice(price) {

        const number = Number(price) || 0;

        return number.toLocaleString("ar-EG") + " ج.م";

    }


    /* ==============================
       تنسيق التاريخ
    ============================== */

    function formatDate(dateValue) {

        if (!dateValue) {
            return "غير محدد";
        }

        const date = new Date(dateValue);

        if (isNaN(date.getTime())) {
            return escapeHTML(dateValue);
        }

        return date.toLocaleString("ar-EG", {
            year: "numeric",
            month: "long",
            day: "numeric",
            hour: "2-digit",
            minute: "2-digit"
        });

    }


    /* ==============================
       الحصول على حالة الطلب
    ============================== */

    function getOrderStatus(order) {

        return order.status || "جديد";

    }


    /* ==============================
       Class الحالة
    ============================== */

    function getStatusClass(status) {

        switch (status) {

            case "جديد":
                return "status-new";

            case "قيد التجهيز":
                return "status-processing";

            case "تم الشحن":
                return "status-shipped";

            case "مكتمل":
                return "status-completed";

            case "ملغي":
                return "status-cancelled";

            default:
                return "status-new";
        }

    }


    /* ==============================
       المنتجات
    ============================== */

    function getProducts(order) {

        if (Array.isArray(order.items)) {
            return order.items;
        }

        if (Array.isArray(order.products)) {
            return order.products;
        }

        return [];

    }


    /* ==============================
       حساب إجمالي الطلب
    ============================== */

    function getOrderTotal(order) {

        if (
            order.total !== undefined &&
            !isNaN(Number(order.total))
        ) {
            return Number(order.total);
        }

        if (
            order.totalPrice !== undefined &&
            !isNaN(Number(order.totalPrice))
        ) {
            return Number(order.totalPrice);
        }

        const products = getProducts(order);

        return products.reduce(function(total, product) {

            const price =
                Number(product.price) || 0;

            const quantity =
                Number(product.quantity) || 1;

            return total + (price * quantity);

        }, 0);

    }


    /* ==============================
       تحديث الإحصائيات
    ============================== */

    function updateStats() {

        const total =
            orders.length;

        const newCount =
            orders.filter(function(order) {
                return getOrderStatus(order) === "جديد";
            }).length;

        const completedCount =
            orders.filter(function(order) {
                return getOrderStatus(order) === "مكتمل";
            }).length;

        const revenue =
            orders.reduce(function(total, order) {

                return total + getOrderTotal(order);

            }, 0);


        document.getElementById(
            "totalOrders"
        ).textContent = total;


        document.getElementById(
            "newOrders"
        ).textContent = newCount;


        document.getElementById(
            "completedOrders"
        ).textContent = completedCount;


        document.getElementById(
            "totalRevenue"
        ).textContent =
            formatPrice(revenue);

    }


    /* ==============================
       البحث
    ============================== */

    function filterOrders() {

        const search =
            document
                .getElementById("searchInput")
                .value
                .trim()
                .toLowerCase();


        const status =
            document
                .getElementById("statusFilter")
                .value;


        return orders.filter(function(order) {

            const orderNumber =
                String(
                    order.orderNumber ||
                    order.orderId ||
                    order.id ||
                    ""
                ).toLowerCase();


            const name =
                String(
                    order.name ||
                    order.customerName ||
                    order.fullName ||
                    ""
                ).toLowerCase();


            const phone =
                String(
                    order.phone ||
                    order.customerPhone ||
                    ""
                ).toLowerCase();


            const matchesSearch =
                !search ||
                orderNumber.includes(search) ||
                name.includes(search) ||
                phone.includes(search);


            const matchesStatus =
                status === "all" ||
                getOrderStatus(order) === status;


            return (
                matchesSearch &&
                matchesStatus
            );

        });

    }


    /* ==============================
       رسم الطلبات
    ============================== */

    function renderOrders() {

        const container =
            document.getElementById(
                "ordersContainer"
            );


        updateStats();


        const filteredOrders =
            filterOrders();


        if (filteredOrders.length === 0) {

            container.innerHTML = `
                <div class="empty">

                    <div class="empty-icon">
                        📦
                    </div>

                    <h2>
                        لا توجد طلبات
                    </h2>

                    <p>
                        ${
                            orders.length === 0
                            ? "لم يتم تسجيل أي طلب حتى الآن."
                            : "لا توجد نتائج مطابقة للبحث."
                        }
                    </p>

                </div>
            `;

            return;
        }


        container.innerHTML =
            filteredOrders
                .map(function(order) {

                    return createOrderHTML(order);

                })
                .join("");

    }


    /* ==============================
       إنشاء كارت الطلب
    ============================== */

    function createOrderHTML(order) {

        const index =
            orders.indexOf(order);


        const orderNumber =
            order.orderNumber ||
            order.orderId ||
            order.id ||
            "بدون رقم";


        const customerName =
            order.name ||
            order.customerName ||
            order.fullName ||
            "غير محدد";


        const phone =
            order.phone ||
            order.customerPhone ||
            "غير محدد";


        const governorate =
            order.governorate ||
            "غير محدد";


        const city =
            order.city ||
            "غير محدد";


        const address =
            order.address ||
            "غير محدد";


        const notes =
            order.notes ||
            "لا توجد ملاحظات";


        const status =
            getOrderStatus(order);


        const products =
            getProducts(order);


        const total =
            getOrderTotal(order);


        let productsHTML = "";


        if (products.length > 0) {

            productsHTML = products.map(function(product) {

                const name =
                    product.name ||
                    product.productName ||
                    "منتج";


                const size =
                    product.size ||
                    "—";


                const color =
                    product.color ||
                    "—";


                const quantity =
                    Number(
                        product.quantity
                    ) || 1;


                const price =
                    Number(
                        product.price
                    ) || 0;


                const itemTotal =
                    price * quantity;


                return `
                    <tr>

                        <td>
                            ${escapeHTML(name)}
                        </td>

                        <td>
                            ${escapeHTML(size)}
                        </td>

                        <td>
                            ${escapeHTML(color)}
                        </td>

                        <td>
                            ${quantity}
                        </td>

                        <td>
                            ${formatPrice(price)}
                        </td>

                        <td>
                            <strong>
                                ${formatPrice(itemTotal)}
                            </strong>
                        </td>

                    </tr>
                `;

            }).join("");

        } else {

            productsHTML = `
                <tr>
                    <td colspan="6">
                        لا توجد تفاصيل منتجات
                    </td>
                </tr>
            `;

        }


        return `

            <article class="order-card">

                <div class="order-header">

                    <div>

                        <div class="order-number">
                            🧾 ${escapeHTML(orderNumber)}
                        </div>

                        <div class="order-date">
                            ${formatDate(
                                order.createdAt ||
                                order.date ||
                                order.createdDate
                            )}
                        </div>

                    </div>


                    <div>

                        <select
                            class="status-select"
                            onchange="changeStatus(${index}, this.value)"
                        >

                            <option
                                value="جديد"
                                ${status === "جديد" ? "selected" : ""}
                            >
                                جديد
                            </option>

                            <option
                                value="قيد التجهيز"
                                ${status === "قيد التجهيز" ? "selected" : ""}
                            >
                                قيد التجهيز
                            </option>

                            <option
                                value="تم الشحن"
                                ${status === "تم الشحن" ? "selected" : ""}
                            >
                                تم الشحن
                            </option>

                            <option
                                value="مكتمل"
                                ${status === "مكتمل" ? "selected" : ""}
                            >
                                مكتمل
                            </option>

                            <option
                                value="ملغي"
                                ${status === "ملغي" ? "selected" : ""}
                            >
                                ملغي
                            </option>

                        </select>

                        <div style="margin-top:8px;text-align:center;">

                            <span class="status-badge ${getStatusClass(status)}">
                                ${escapeHTML(status)}
                            </span>

                        </div>

                    </div>

                </div>


                <div class="order-body">

                    <div class="customer-grid">

                        <div class="customer-item">

                            <div class="customer-label">
                                اسم العميل
                            </div>

                            <div class="customer-value">
                                ${escapeHTML(customerName)}
                            </div>

                        </div>


                        <div class="customer-item">

                            <div class="customer-label">
                                رقم الهاتف
                            </div>

                            <div class="customer-value">
                                ${escapeHTML(phone)}
                            </div>

                        </div>


                        <div class="customer-item">

                            <div class="customer-label">
                                المحافظة
                            </div>

                            <div class="customer-value">
                                ${escapeHTML(governorate)}
                            </div>

                        </div>


                        <div class="customer-item">

                            <div class="customer-label">
                                المدينة / المنطقة
                            </div>

                            <div class="customer-value">
                                ${escapeHTML(city)}
                            </div>

                        </div>


                        <div class="customer-item">

                            <div class="customer-label">
                                العنوان
                            </div>

                            <div class="customer-value">
                                ${escapeHTML(address)}
                            </div>

                        </div>


                        <div class="customer-item">

                            <div class="customer-label">
                                ملاحظات
                            </div>

                            <div class="customer-value">
                                ${escapeHTML(notes)}
                            </div>

                        </div>

                    </div>


                    <div class="products-title">
                        🛍️ المنتجات المطلوبة
                    </div>


                    <div style="overflow-x:auto;">

                        <table class="product-table">

                            <thead>

                                <tr>

                                    <th>
                                        المنتج
                                    </th>

                                    <th>
                                        المقاس
                                    </th>

                                    <th>
                                        اللون
                                    </th>

                                    <th>
                                        الكمية
                                    </th>

                                    <th>
                                        سعر القطعة
                                    </th>

                                    <th>
                                        الإجمالي
                                    </th>

                                </tr>

                            </thead>

                            <tbody>
                                ${productsHTML}
                            </tbody>

                        </table>

                    </div>


                    <div class="order-footer">

                        <div>

                            <div class="total-label">
                                إجمالي الطلب
                            </div>

                            <div class="total-price">
                                ${formatPrice(total)}
                            </div>

                        </div>


                        <div class="order-actions">

                            <button
                                class="btn btn-light"
                                onclick="callCustomer('${escapeJS(phone)}')"
                            >
                                📞 اتصال
                            </button>

                            <button
                                class="btn btn-danger"
                                onclick="confirmDeleteOrder(${index})"
                            >
                                🗑️ حذف الطلب
                            </button>

                        </div>

                    </div>

                </div>

            </article>

        `;

    }


    /* ==============================
       حماية JavaScript
    ============================== */

    function escapeJS(value) {

        return String(value || "")
            .replace(/\\/g, "\\\\")
            .replace(/'/g, "\\'")
            .replace(/"/g, '\\"')
            .replace(/\n/g, "\\n")
            .replace(/\r/g, "\\r");

    }


    /* ==============================
       تغيير حالة الطلب
    ============================== */

    function changeStatus(index, newStatus) {

        if (!orders[index]) {
            return;
        }


        orders[index].status =
            newStatus;


        orders[index].updatedAt =
            new Date().toISOString();


        saveOrders();

        renderOrders();

    }


    /* ==============================
       الاتصال بالعميل
    ============================== */

    function callCustomer(phone) {

        if (!phone || phone === "غير محدد") {

            alert(
                "رقم الهاتف غير موجود."
            );

            return;
        }


        const cleanPhone =
            String(phone)
                .replace(/[^\d+]/g, "");


        window.location.href =
            "tel:" + cleanPhone;

    }


    /* ==============================
       حذف طلب
    ============================== */

    function confirmDeleteOrder(index) {

        if (!orders[index]) {
            return;
        }


        const order =
            orders[index];


        const orderNumber =
            order.orderNumber ||
            order.orderId ||
            order.id ||
            "هذا الطلب";


        openModal(
            "حذف الطلب",
            "هل أنت متأكد أنك تريد حذف الطلب " +
            orderNumber +
            "؟ لا يمكن التراجع عن هذه العملية.",
            function() {

                orders.splice(
                    index,
                    1
                );


                saveOrders();

                closeModal();

                renderOrders();

            }
        );

    }


    /* ==============================
       حذف كل الطلبات
    ============================== */

    function confirmDeleteAll() {

        if (orders.length === 0) {

            alert(
                "لا توجد طلبات لحذفها."
            );

            return;
        }


        openModal(
            "حذف كل الطلبات",
            "سيتم حذف جميع الطلبات نهائيًا من هذا المتصفح. هل أنت متأكد؟",
            function() {

                orders = [];

                saveOrders();

                localStorage.removeItem(
                    "lastGamyOrder"
                );

                closeModal();

                renderOrders();

            }
        );

    }


    /* ==============================
       Modal
    ============================== */

    function openModal(
        title,
        message,
        action
    ) {

        document.getElementById(
            "modalTitle"
        ).textContent = title;


        document.getElementById(
            "modalMessage"
        ).textContent = message;


        pendingAction = action;


        document.getElementById(
            "confirmModal"
        ).classList.add("active");


        document.getElementById(
            "confirmButton"
        ).onclick = function() {

            if (typeof pendingAction === "function") {

                pendingAction();

            }

        };

    }


    function closeModal() {

        document.getElementById(
            "confirmModal"
        ).classList.remove("active");


        pendingAction = null;

    }


    /* ==============================
       الضغط خارج المودال
    ============================== */

    document
        .getElementById("confirmModal")
        .addEventListener(
            "click",
            function(event) {

                if (
                    event.target === this
                ) {

                    closeModal();

                }

            }
        );


    /* ==============================
       زر ESC
    ============================== */

    document.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Escape"
            ) {

                closeModal();

            }

        }
    );


    /* ==============================
       تحديث تلقائي لو checkout
       فتح في Tab آخر
    ============================== */

    window.addEventListener(
        "storage",
        function(event) {

            if (
                event.key === "gamyOrders"
            ) {

                loadOrders();

                renderOrders();

            }

        }
    );


    /* ==============================
       تشغيل الصفحة
    ============================== */

    loadOrders();

    renderOrders();

</script>

</body>
</html>
