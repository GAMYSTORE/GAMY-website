<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة الطلبات | GAMY STORE</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #111;
}

/* ================= HEADER ================= */

header {
    background: #111;
    color: #fff;
    padding: 18px 6%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
}

.logo {
    font-size: 25px;
    font-weight: bold;
    letter-spacing: 2px;
}

.header-actions {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
}

.header-actions button {
    border: 1px solid #555;
    background: #222;
    color: #fff;
    padding: 10px 15px;
    border-radius: 6px;
    cursor: pointer;
}

.header-actions button:hover {
    background: #333;
}

.realtime-status {
    display: flex;
    align-items: center;
    gap: 7px;
    background: #222;
    border: 1px solid #444;
    padding: 9px 12px;
    border-radius: 6px;
    font-size: 13px;
}

.realtime-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #999;
}

.realtime-dot.online {
    background: #35c759;
}

.realtime-dot.offline {
    background: #ff3b30;
}

/* ================= LOGIN ================= */

.login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: #f5f5f5;
}

.login-box {
    width: 100%;
    max-width: 430px;
    background: #fff;
    padding: 35px 25px;
    border-radius: 12px;
    box-shadow: 0 5px 25px rgba(0,0,0,0.08);
}

.login-box h1 {
    text-align: center;
    margin-bottom: 10px;
}

.login-box > p {
    text-align: center;
    color: #666;
    margin-bottom: 25px;
}

.form-group {
    margin-bottom: 18px;
}

.form-group label {
    display: block;
    margin-bottom: 8px;
    font-weight: bold;
}

.form-group input,
.search-box input,
.filter-box select {
    width: 100%;
    padding: 13px;
    border: 1px solid #ddd;
    border-radius: 7px;
    outline: none;
    font-size: 15px;
}

.form-group input:focus,
.search-box input:focus,
.filter-box select:focus {
    border-color: #111;
}

.login-button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 7px;
    background: #111;
    color: #fff;
    font-size: 16px;
    cursor: pointer;
}

.login-button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

/* ================= ERRORS ================= */

.error-message {
    display: none;
    background: #ffeaea;
    color: #b00000;
    padding: 12px;
    border-radius: 7px;
    margin-bottom: 15px;
    line-height: 1.6;
    white-space: pre-line;
}

/* ================= DASHBOARD ================= */

.dashboard {
    display: none;
}

.container {
    width: 92%;
    max-width: 1400px;
    margin: auto;
}

/* ================= TITLE ================= */

.page-title {
    padding: 35px 0 25px;
}

.page-title h1 {
    font-size: 32px;
    margin-bottom: 8px;
}

.page-title p {
    color: #666;
}

/* ================= STATS ================= */

.stats {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 14px;
    margin-bottom: 25px;
}

.stat-card {
    background: #fff;
    border-radius: 10px;
    padding: 20px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.05);
}

.stat-card h3 {
    font-size: 14px;
    color: #777;
    margin-bottom: 12px;
}

.stat-card strong {
    font-size: 25px;
}

/* ================= FILTERS ================= */

.filters {
    background: #fff;
    padding: 20px;
    border-radius: 10px;
    margin-bottom: 25px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.05);
    display: grid;
    grid-template-columns: 1fr 220px;
    gap: 15px;
}

.search-box input {
    height: 46px;
}

.filter-box select {
    height: 46px;
}

/* ================= ORDERS ================= */

.orders-container {
    padding-bottom: 60px;
}

.orders-list {
    display: flex;
    flex-direction: column;
    gap: 18px;
}

.order-card {
    position: relative;
    background: #fff;
    border-radius: 12px;
    padding: 22px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.05);
    border: 2px solid transparent;
}

.order-card.new-order {
    border-color: #111;
}

.new-badge {
    display: inline-block;
    background: #111;
    color: #fff;
    padding: 5px 9px;
    border-radius: 5px;
    font-size: 12px;
    margin-top: 8px;
}

.order-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    padding-bottom: 18px;
    border-bottom: 1px solid #eee;
}

.order-number {
    font-size: 20px;
    font-weight: bold;
}

.order-date {
    color: #777;
    font-size: 13px;
    margin-top: 6px;
}

.status-select {
    border: 1px solid #ddd;
    padding: 9px 12px;
    border-radius: 6px;
    background: #fff;
    font-size: 14px;
    cursor: pointer;
}

.order-body {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 25px;
    padding-top: 20px;
}

.info-section h3 {
    font-size: 17px;
    margin-bottom: 12px;
}

.info-row {
    margin-bottom: 8px;
    color: #555;
    line-height: 1.6;
}

.info-row strong {
    color: #111;
}

.products-section {
    grid-column: 1 / -1;
}

.product-item {
    border: 1px solid #eee;
    border-radius: 8px;
    padding: 14px;
    margin-bottom: 10px;
}

.product-item h4 {
    margin-bottom: 8px;
}

.product-item p {
    color: #666;
    font-size: 14px;
    margin: 4px 0;
}

.order-footer {
    margin-top: 20px;
    padding-top: 18px;
    border-top: 2px solid #111;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
}

.total {
    font-size: 21px;
    font-weight: bold;
}

.order-actions {
    display: flex;
    gap: 10px;
}

.call-button,
.delete-button {
    border: none;
    padding: 10px 15px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    text-decoration: none;
    text-align: center;
}

.call-button {
    background: #111;
    color: #fff;
}

.delete-button {
    background: #ffe5e5;
    color: #b00000;
}

.call-button:hover {
    background: #333;
}

.delete-button:hover {
    background: #ffd5d5;
}

/* ================= EMPTY ================= */

.empty-orders {
    background: #fff;
    border-radius: 10px;
    padding: 60px 20px;
    text-align: center;
    color: #777;
}

.empty-orders h2 {
    margin-bottom: 10px;
    color: #111;
}

/* ================= LOADING ================= */

.loading {
    background: #fff;
    border-radius: 10px;
    padding: 40px;
    text-align: center;
    color: #666;
}

/* ================= TOAST ================= */

.toast {
    position: fixed;
    bottom: 25px;
    left: 25px;
    max-width: 380px;
    background: #111;
    color: #fff;
    padding: 15px 20px;
    border-radius: 8px;
    display: none;
    z-index: 10000;
    box-shadow: 0 5px 20px rgba(0,0,0,0.2);
    line-height: 1.6;
}

.toast.new {
    padding: 18px 22px;
    font-weight: bold;
}

/* ================= MOBILE ================= */

@media (max-width: 1100px) {

    .stats {
        grid-template-columns: repeat(3, 1fr);
    }

}

@media (max-width: 900px) {

    .stats {
        grid-template-columns: repeat(2, 1fr);
    }

    .order-body {
        grid-template-columns: 1fr;
    }

    .products-section {
        grid-column: auto;
    }

    .filters {
        grid-template-columns: 1fr;
    }

}

@media (max-width: 600px) {

    header {
        padding: 15px 5%;
        align-items: flex-start;
    }

    .logo {
        font-size: 20px;
    }

    .header-actions {
        justify-content: flex-end;
    }

    .realtime-status {
        display: none;
    }

    .stats {
        grid-template-columns: 1fr 1fr;
        gap: 10px;
    }

    .stat-card {
        padding: 16px;
    }

    .stat-card strong {
        font-size: 22px;
    }

    .order-header {
        flex-direction: column;
        align-items: stretch;
    }

    .status-select {
        width: 100%;
    }

    .order-footer {
        flex-direction: column;
        align-items: stretch;
    }

    .order-actions {
        width: 100%;
    }

    .call-button,
    .delete-button {
        flex: 1;
    }

    .toast {
        left: 15px;
        right: 15px;
        bottom: 15px;
        max-width: none;
    }

}


/* ==================================================
   GAMY STORE PREMIUM UI EFFECTS
   ================================================== */

html {
    scroll-behavior: smooth;
}

body {
    overflow-x: hidden;
}

/* Subtle animated background */
.dashboard {
    min-height: 100vh;
    background:
        radial-gradient(circle at 8% 10%, rgba(17,17,17,.035), transparent 28%),
        radial-gradient(circle at 92% 18%, rgba(17,17,17,.025), transparent 30%),
        #f5f5f5;
}

/* Header */
header {
    position: sticky;
    top: 0;
    z-index: 1000;
    box-shadow: 0 8px 28px rgba(0,0,0,.10);
    transition: box-shadow .3s ease, transform .3s ease;
}

.logo {
    transition: transform .3s ease, letter-spacing .3s ease;
}

.logo:hover {
    transform: translateY(-1px);
    letter-spacing: 3px;
}

/* Header buttons */
.header-actions button {
    position: relative;
    overflow: hidden;
    transition:
        transform .22s ease,
        background .22s ease,
        border-color .22s ease,
        box-shadow .22s ease;
}

.header-actions button::after,
.login-button::after,
.call-button::after,
.delete-button::after {
    content: "";
    position: absolute;
    top: 0;
    left: -120%;
    width: 70%;
    height: 100%;
    background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.22),
        transparent
    );
    transform: skewX(-20deg);
    transition: left .55s ease;
}

.header-actions button:hover::after,
.login-button:hover::after,
.call-button:hover::after,
.delete-button:hover::after {
    left: 140%;
}

.header-actions button:hover {
    transform: translateY(-2px);
    background: #303030;
    border-color: #777;
    box-shadow: 0 7px 18px rgba(0,0,0,.18);
}

.header-actions button:active,
.login-button:active,
.call-button:active,
.delete-button:active {
    transform: translateY(0) scale(.97);
}

.header-actions button:disabled {
    transform: none;
    box-shadow: none;
}

/* Realtime */
.realtime-status {
    transition: transform .25s ease, box-shadow .25s ease;
}

.realtime-status:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(0,0,0,.15);
}

.realtime-dot.online {
    animation: realtimePulse 1.8s ease-in-out infinite;
    box-shadow: 0 0 0 0 rgba(53,199,89,.45);
}

.realtime-dot.offline {
    animation: offlinePulse 1.4s ease-in-out infinite;
}

@keyframes realtimePulse {
    0%,100% { box-shadow: 0 0 0 0 rgba(53,199,89,.45); }
    50% { box-shadow: 0 0 0 7px rgba(53,199,89,0); }
}

@keyframes offlinePulse {
    0%,100% { opacity: 1; }
    50% { opacity: .45; }
}

/* Login screen */
.login-screen {
    position: relative;
    overflow: hidden;
    background:
        radial-gradient(circle at 20% 20%, rgba(0,0,0,.06), transparent 25%),
        radial-gradient(circle at 80% 80%, rgba(0,0,0,.05), transparent 25%),
        #f5f5f5;
}

.login-screen::before,
.login-screen::after {
    content: "";
    position: absolute;
    border: 1px solid rgba(0,0,0,.05);
    border-radius: 50%;
    pointer-events: none;
}

.login-screen::before {
    width: 420px;
    height: 420px;
    top: -180px;
    right: -150px;
    animation: floatingCircle 8s ease-in-out infinite;
}

.login-screen::after {
    width: 320px;
    height: 320px;
    bottom: -160px;
    left: -100px;
    animation: floatingCircle 10s ease-in-out infinite reverse;
}

.login-box {
    position: relative;
    z-index: 1;
    border: 1px solid rgba(0,0,0,.05);
    animation: loginEnter .65s cubic-bezier(.2,.8,.2,1) both;
    transition: transform .3s ease, box-shadow .3s ease;
}

.login-box:hover {
    transform: translateY(-4px);
    box-shadow: 0 18px 45px rgba(0,0,0,.12);
}

.login-box h1 {
    letter-spacing: 1px;
    transition: letter-spacing .3s ease, transform .3s ease;
}

.login-box:hover h1 {
    letter-spacing: 3px;
    transform: translateY(-1px);
}

@keyframes loginEnter {
    from {
        opacity: 0;
        transform: translateY(24px) scale(.97);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

@keyframes floatingCircle {
    0%,100% { transform: translate3d(0,0,0); }
    50% { transform: translate3d(0,20px,0); }
}

/* Inputs */
.form-group input,
.search-box input,
.filter-box select {
    transition:
        border-color .25s ease,
        box-shadow .25s ease,
        transform .2s ease,
        background .25s ease;
}

.form-group input:hover,
.search-box input:hover,
.filter-box select:hover {
    border-color: #aaa;
}

.form-group input:focus,
.search-box input:focus,
.filter-box select:focus {
    border-color: #111;
    box-shadow: 0 0 0 4px rgba(17,17,17,.07);
    transform: translateY(-1px);
    background: #fff;
}

/* Login button */
.login-button {
    position: relative;
    overflow: hidden;
    transition: transform .22s ease, box-shadow .22s ease, background .22s ease;
}

.login-button:hover {
    background: #222;
    transform: translateY(-2px);
    box-shadow: 0 9px 22px rgba(0,0,0,.2);
}

.login-button:disabled {
    transform: none;
}

/* Error animation */
.error-message {
    animation: errorIn .3s ease both;
}

@keyframes errorIn {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
}

/* Page title */
.page-title {
    animation: contentIn .55s ease both;
}

.page-title h1 {
    transition: transform .25s ease;
}

.page-title h1:hover {
    transform: translateX(-4px);
}

@keyframes contentIn {
    from {
        opacity: 0;
        transform: translateY(12px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Stats */
.stat-card {
    position: relative;
    overflow: hidden;
    border: 1px solid rgba(0,0,0,.035);
    transition:
        transform .28s cubic-bezier(.2,.8,.2,1),
        box-shadow .28s ease,
        border-color .28s ease;
    animation: statIn .55s ease both;
}

.stat-card:nth-child(1) { animation-delay: .04s; }
.stat-card:nth-child(2) { animation-delay: .08s; }
.stat-card:nth-child(3) { animation-delay: .12s; }
.stat-card:nth-child(4) { animation-delay: .16s; }
.stat-card:nth-child(5) { animation-delay: .20s; }
.stat-card:nth-child(6) { animation-delay: .24s; }

.stat-card::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(
        115deg,
        transparent 35%,
        rgba(0,0,0,.035) 50%,
        transparent 65%
    );
    transform: translateX(-120%);
    transition: transform .65s ease;
    pointer-events: none;
}

.stat-card:hover::before {
    transform: translateX(120%);
}

.stat-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 13px 30px rgba(0,0,0,.10);
    border-color: rgba(0,0,0,.10);
}

.stat-card strong {
    display: inline-block;
    transition: transform .25s ease;
}

.stat-card:hover strong {
    transform: scale(1.04);
}

@keyframes statIn {
    from {
        opacity: 0;
        transform: translateY(15px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Filters */
.filters {
    border: 1px solid rgba(0,0,0,.035);
    transition: box-shadow .3s ease, transform .3s ease;
    animation: contentIn .6s ease both;
}

.filters:hover {
    box-shadow: 0 10px 28px rgba(0,0,0,.08);
}

/* Orders */
.orders-list {
    perspective: 1200px;
}

.order-card {
    border: 2px solid transparent;
    transform-origin: center;
    animation: orderIn .48s cubic-bezier(.2,.8,.2,1) both;
    transition:
        transform .28s cubic-bezier(.2,.8,.2,1),
        box-shadow .28s ease,
        border-color .28s ease;
}

.order-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 16px 34px rgba(0,0,0,.10);
    border-color: #ddd;
}

.order-card.new-order {
    animation:
        orderIn .48s cubic-bezier(.2,.8,.2,1) both,
        newOrderGlow 2.4s ease-in-out infinite;
}

.order-card.new-order:hover {
    border-color: #111;
}

@keyframes orderIn {
    from {
        opacity: 0;
        transform: translateY(18px) scale(.985);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

@keyframes newOrderGlow {
    0%,100% {
        box-shadow: 0 3px 12px rgba(0,0,0,.05);
    }
    50% {
        box-shadow: 0 8px 28px rgba(0,0,0,.14);
    }
}

.new-badge {
    animation: badgePulse 1.8s ease-in-out infinite;
    box-shadow: 0 3px 10px rgba(0,0,0,.12);
}

@keyframes badgePulse {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.04); }
}

/* Order header */
.order-number {
    transition: transform .25s ease, letter-spacing .25s ease;
}

.order-card:hover .order-number {
    transform: translateX(-3px);
    letter-spacing: .3px;
}

.order-date {
    transition: color .25s ease;
}

.order-card:hover .order-date {
    color: #444;
}

/* Status select */
.status-select {
    transition:
        border-color .25s ease,
        box-shadow .25s ease,
        transform .2s ease;
}

.status-select:hover {
    border-color: #999;
    transform: translateY(-1px);
}

.status-select:focus {
    border-color: #111;
    outline: none;
    box-shadow: 0 0 0 4px rgba(17,17,17,.06);
}

/* Info sections */
.info-section h3,
.products-section h3 {
    transition: transform .25s ease;
}

.order-card:hover .info-section h3,
.order-card:hover .products-section h3 {
    transform: translateX(-3px);
}

.info-row {
    transition: transform .2s ease, color .2s ease;
}

.info-row:hover {
    transform: translateX(-3px);
    color: #333;
}

/* Product items */
.product-item {
    transition:
        transform .24s ease,
        box-shadow .24s ease,
        border-color .24s ease;
}

.product-item:hover {
    transform: translateY(-2px);
    border-color: #ccc;
    box-shadow: 0 7px 18px rgba(0,0,0,.06);
}

.product-item h4 {
    transition: transform .2s ease;
}

.product-item:hover h4 {
    transform: translateX(-2px);
}

/* Footer / total */
.order-footer {
    transition: border-color .25s ease;
}

.order-card:hover .order-footer {
    border-color: #000;
}

.total {
    transition: transform .25s ease;
}

.order-card:hover .total {
    transform: scale(1.02);
}

/* Action buttons */
.order-actions button,
.order-actions a {
    position: relative;
    overflow: hidden;
    transition:
        transform .22s ease,
        box-shadow .22s ease,
        background .22s ease;
}

.call-button {
    box-shadow: 0 4px 12px rgba(0,0,0,.08);
}

.call-button:hover {
    background: #222;
    transform: translateY(-3px);
    box-shadow: 0 9px 20px rgba(0,0,0,.16);
}

.delete-button:hover {
    background: #ffd0d0;
    transform: translateY(-3px);
    box-shadow: 0 9px 20px rgba(176,0,0,.10);
}

/* Loading */
.loading {
    position: relative;
    overflow: hidden;
}

.loading::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(
        90deg,
        transparent,
        rgba(0,0,0,.045),
        transparent
    );
    transform: translateX(-100%);
    animation: loadingSweep 1.25s ease-in-out infinite;
}

@keyframes loadingSweep {
    to { transform: translateX(100%); }
}

/* Empty state */
.empty-orders {
    animation: contentIn .45s ease both;
    transition: transform .25s ease, box-shadow .25s ease;
}

.empty-orders:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 25px rgba(0,0,0,.07);
}

/* Toast */
.toast {
    opacity: 0;
    transform: translateY(20px) scale(.96);
    transition:
        opacity .3s ease,
        transform .3s cubic-bezier(.2,.8,.2,1);
}

.toast[style*="display: block"] {
    opacity: 1;
    transform: translateY(0) scale(1);
}

.toast.new {
    animation: toastNew .45s cubic-bezier(.2,.8,.2,1) both;
    box-shadow: 0 12px 35px rgba(0,0,0,.22);
}

@keyframes toastNew {
    0% {
        opacity: 0;

/* ==================================================
   TOAST
================================================== */

function showToast(message, isNew = false) {

    toast.textContent =
        message;

    toast.classList.toggle(
        "new",
        isNew
    );

    toast.style.display =
        "block";

    clearTimeout(toastTimer);

    toastTimer =
        setTimeout(function() {

            toast.style.display =
                "none";

            toast.classList.remove("new");

        }, isNew ? 7000 : 3000);

}


/* ==================================================
   ESCAPE HTML
================================================== */

function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* ==================================================
   NUMBER
================================================== */

function numberValue(value) {

    const number =
        Number(value);

    return Number.isFinite(number)
        ? number
        : 0;

}


/* ==================================================
   DATE
================================================== */

function formatDate(dateValue) {

    if (!dateValue) {
        return "-";
    }

    const date =
        new Date(dateValue);

    if (Number.isNaN(date.getTime())) {
        return "-";
    }

    return date.toLocaleString(
        "ar-EG",
        {
            dateStyle: "medium",
            timeStyle: "short"
        }
    );

}


/* ==================================================

================================================== */

async function checkAdminAccess() {

    const result =
        await supabaseClient.auth.getUser();

    if (result.error) {
        throw result.error;
    }

    const user =
        result.data.user;

    if (!user) {
        return false;

    return user.id === ADMIN_USER_ID;

}

/* ==================================================
   LOAD ORDERS
================================================== */

async function loadOrders() {

    loadingOrders.style.display =
        "block";

    ordersList.innerHTML =
        "";

    try {

        const result =
            await supabaseClient
                .from("orders")
                .select("*")
                .order(
                    "created_at",
                    {
                        ascending: false
                    }
                );

        if (result.error) {
            throw result.error;
        }

        allOrders =
            Array.isArray(result.data)
                ? result.data
                : [];

        loadingOrders.style.display =
            "none";

        renderOrders();

        updateStats();

    } catch (error) {

        console.error(
            "Load Orders Error:",
            error
        );

        loadingOrders.style.display =
            "none";

        ordersList.innerHTML = `

            <div class="empty-orders">

                <h2>
                    حدث خطأ أثناء تحميل الطلبات

            </div>

    }

}


/* ==================================================
   FILTER ORDERS
================================================== */

function getFilteredOrders() {

    const search =
        searchInput.value
            .trim()
            .toLowerCase();

    const status =
        statusFilter.value;

    return allOrders.filter(
        function(order) {

            const searchText = (

                String(
                    order.order_number || ""
                ) +

                " " +

                String(
                    order.customer_name || ""
                ) +

                " " +

                String(
                    order.customer_phone || ""
                )

            ).toLowerCase();

            const matchesSearch =
                !search ||
                searchText.includes(search);

            const matchesStatus =
                status === "all" ||
                order.status === status;

            return (
                matchesSearch &&
                matchesStatus
            );

        }
    );

}


/* ==================================================
   RENDER ORDERS
================================================== */

function renderOrders() {

    const orders =
        getFilteredOrders();

    ordersList.innerHTML =
        "";

    if (orders.length === 0) {

        ordersList.innerHTML = `

            <div class="empty-orders">

                <h2>
                    لا توجد طلبات
                </h2>

                <p>
                    لا توجد طلبات مطابقة للبحث أو الفلتر الحالي.
                </p>

            </div>

        `;

        return;
    }

    orders.forEach(
        function(order, index) {

            const orderCard =
                createOrderCard(order);

            orderCard.style.animationDelay =
                Math.min(index * 45, 450) + "ms";

            ordersList.appendChild(orderCard);

        }
    );

}

function createOrderCard(order) {

        document.createElement("div");

    card.className =
        "order-card";

    if (order.status === "جديد") {
        card.classList.add("new-order");
    }

    const items =
        Array.isArray(order.items)
            ? order.items
            : [];

    let productsHTML =
        "";

    if (items.length === 0) {

        productsHTML = `
            <p>
                لا توجد منتجات مسجلة.
            </p>
        `;

    } else {

        productsHTML =
            items.map(
                function(item) {

                    const price =
                        numberValue(item.price);

                    const quantity =
                        Math.max(
                            1,
                            Math.floor(
                                numberValue(
                                    item.quantity
                                )
                            )
                        );

                    const itemTotal =
                        numberValue(
                            item.total
                        ) ||
                        price * quantity;

                    return `

                        <div class="product-item">

                            <h4>
                                ${escapeHTML(
                                    item.name || "منتج"
                                )}
                            </h4>

                            <p>
                                المقاس:
                                ${escapeHTML(
                                    item.size || "-"
                                )}
                            </p>

                            <p>
                                اللون:
                                ${escapeHTML(
                                    item.color || "-"
                                )}
                            </p>

                                الكمية:
                                ${quantity}
                            </p>

                            <p>

                                ${price.toLocaleString("ar-EG")}
                                جنيه
                            </p>

                            <p>
                                إجمالي المنتج:
                                ${itemTotal.toLocaleString("ar-EG")}
                                جنيه
                            </p>

                        </div>

                    `;

                }
            ).join("");

    }

    const phone =
        String(
            order.customer_phone || ""
        );

    const encodedPhone =
        encodeURIComponent(
            phone
        );

    const newBadge =
        order.status === "جديد"
            ? `<span class="new-badge">طلب جديد</span>`

    card.innerHTML = `

                    ${escapeHTML(

                    )}
                </div>

                    ${formatDate(

                    )}
                </div>

                ${newBadge}

            </div>

            <select

            >

                <option value="جديد"
                    ${order.status === "جديد" ? "selected" : ""}>
                    جديد
                </option>

                <option value="قيد التجهيز"
                    ${order.status === "قيد التجهيز" ? "selected" : ""}>
                    قيد التجهيز
                </option>

                <option value="تم الشحن"
                    ${order.status === "تم الشحن" ? "selected" : ""}>
                    تم الشحن
                </option>

                <option value="مكتمل"
                    ${order.status === "مكتمل" ? "selected" : ""}>
                    مكتمل
                </option>

                <option value="ملغي"
                    ${order.status === "ملغي" ? "selected" : ""}>
                    ملغي
                </option>

            </select>

        </div>


        <div class="order-body">

            <div class="info-section">

                <h3>
                    👤 بيانات العميل
                </h3>

                <div class="info-row">

                    <strong>
                        الاسم:
                    </strong>

                    ${escapeHTML(
                        order.customer_name || "-"
                    )}

                </div>

                <div class="info-row">

                    <strong>
                        الهاتف:
                    </strong>

                    ${escapeHTML(
                        order.customer_phone || "-"
                    )}

                </div>

                <div class="info-row">

                    <strong>
                        المحافظة:
                    </strong>

                    ${escapeHTML(
                        order.governorate || "-"
                    )}

                </div>

                <div class="info-row">

                    <strong>
                        المدينة:

                    ${escapeHTML(
                        order.city || "-"
                    )}

                </div>

/* ==================================================
   UPDATE STATS
================================================== */

function updateStats() {

    const total =
        allOrders.length;

    const newCount =
        allOrders.filter(
            function(order) {
                return order.status === "جديد";
            }
        ).length;

    const processingCount =
        allOrders.filter(
            function(order) {
                return order.status === "قيد التجهيز";
            }
        ).length;

    const shippedCount =
        allOrders.filter(
            function(order) {
                return order.status === "تم الشحن";
            }
        ).length;

    const completedCount =
        allOrders.filter(
            function(order) {
                return order.status === "مكتمل";
            }
        ).length;

    const revenue =
        allOrders.reduce(
            function(sum, order) {

                return sum +
                    numberValue(
                        order.total
                    );

            },
            0
        );

    totalOrders.textContent =
        total.toLocaleString("ar-EG");

    newOrders.textContent =
        newCount.toLocaleString("ar-EG");

    processingOrders.textContent =
        processingCount.toLocaleString("ar-EG");

    shippedOrders.textContent =
        shippedCount.toLocaleString("ar-EG");

    completedOrders.textContent =
        completedCount.toLocaleString("ar-EG");

    totalRevenue.textContent =
        revenue.toLocaleString("ar-EG");

}


/* ==================================================
   UPDATE ORDER STATUS
================================================== */

async function updateOrderStatus(
    orderId,
    newStatus
) {

    try {

        const result =
            await supabaseClient
                .from("orders")
                .update({

                    status:
                        newStatus,

                    updated_at:
                        new Date().toISOString()

                })
                .eq(
                    "id",
                    orderId
                );

        if (result.error) {
            throw result.error;
        }

        const order =
            allOrders.find(
                function(item) {
                    return item.id === orderId;
                }
            );

        if (order) {
            order.status =
                newStatus;
        }

        updateStats();

        renderOrders();

        showToast(
            "تم تحديث حالة الطلب بنجاح ✓"
        );

    } catch (error) {

        console.error(
            "Update Status Error:",
            error
        );

        alert(
            "تعذر تحديث حالة الطلب:\n\n" +
            (
                error.message ||
                "حدث خطأ غير معروف."
            )
        );

        await loadOrders();

    }

}


/* ==================================================
   DELETE ORDER
================================================== */

async function deleteOrder(orderId) {

    const order =
        allOrders.find(
            function(item) {
                return item.id === orderId;
            }
        );

    const orderNumber =
        order
            ? order.order_number
            : "هذا الطلب";

    const confirmed =
        confirm(
            "هل أنت متأكد من حذف الطلب:\n\n" +
            orderNumber +
            "\n\nلا يمكن التراجع عن هذا الإجراء."
        );

    if (!confirmed) {
        return;
    }

    try {

        const result =
            await supabaseClient
                .from("orders")
                .delete()
                .eq(
                    "id",
                    orderId
                );

        if (result.error) {
            throw result.error;
        }

        allOrders =
            allOrders.filter(
                function(item) {
                    return item.id !== orderId;
                }
            );

        updateStats();

        renderOrders();

        showToast(
            "تم حذف الطلب بنجاح"
        );

    } catch (error) {

        console.error(
            "Delete Order Error:",
            error
        );

        alert(
            "تعذر حذف الطلب:\n\n" +
            (
                error.message ||
                "حدث خطأ غير معروف."
            )
        );

    }

}


/* ==================================================
   SEARCH
================================================== */

searchInput.addEventListener(
    "input",
    function() {

        renderOrders();

    }
);


/* ==================================================
   STATUS FILTER
================================================== */

statusFilter.addEventListener(
    "change",
    function() {

        renderOrders();

    }
);


/* ==================================================
   REFRESH
================================================== */

refreshButton.addEventListener(
    "click",
    async function() {

        refreshButton.disabled =
            true;

        refreshButton.classList.add("is-refreshing");

        refreshButton.textContent =
            "جاري التحديث...";

        await loadOrders();

        refreshButton.disabled =
            false;

        refreshButton.classList.remove("is-refreshing");

        refreshButton.textContent =
            "🔄 تحديث";

    }
);


/* ==================================================
   LOGOUT
================================================== */

logoutButton.addEventListener(
    "click",
    async function() {

        try {

            stopRealtime();

            await supabaseClient.auth.signOut();

        } catch (error) {

            console.error(
                "Logout Error:",
                error
            );

        }

        allOrders = [];

        showLogin();

    }
);


/* ==================================================
   NOTIFICATIONS
================================================== */

async function requestNotificationPermission() {

    if (!("Notification" in window)) {
        return;
    }

    if (Notification.permission === "default") {

        try {

            await Notification.requestPermission();

        } catch (error) {

            console.log(
                "Notification permission error:",
                error
            );

        }

    }

}


function notifyNewOrder(order) {

    const orderNumber =
        order.order_number ||
        "طلب جديد";

    const customerName =
        order.customer_name ||
        "عميل";

    const total =
        numberValue(
            order.total
        ).toLocaleString("ar-EG");

    const message =
        `طلب جديد ${orderNumber} من ${customerName} - الإجمالي ${total} جنيه`;

    showToast(
        "🔔 " + message,
        true
    );

    if (
        "Notification" in window &&
        Notification.permission === "granted"
    ) {

        try {

            new Notification(
                "GAMY STORE - طلب جديد",
                {
                    body: message
                }
            );

        } catch (error) {

            console.log(
                "Browser notification error:",
                error
            );

        }

    }

}


/* ==================================================
   REALTIME
================================================== */

function setRealtimeStatus(
    online,
    text
) {

    realtimeDot.classList.toggle(
        "online",
        online
    );

    realtimeDot.classList.toggle(
        "offline",
        !online
    );

    realtimeText.textContent =
        text;

}


function startRealtime() {

    stopRealtime();

    setRealtimeStatus(
        false,
        "جاري الاتصال..."
    );

    realtimeChannel =
        supabaseClient
            .channel(
                "gamy-orders-realtime"
            )
            .on(
                "postgres_changes",
                {
                    event: "INSERT",
                    schema: "public",
                    table: "orders"
                },
                function(payload) {

                    console.log(
                        "New order:",
                        payload
                    );

                    const newOrder =
                        payload.new;

                    const alreadyExists =
                        allOrders.some(
                            function(order) {
                                return order.id === newOrder.id;
                            }
                        );

                    if (!alreadyExists) {

                        notifyNewOrder(
                            newOrder
                        );

                    }

                    loadOrders();

                }
            )
            .on(
                "postgres_changes",
                {
                    event: "UPDATE",
                    schema: "public",
                    table: "orders"
                },
                function(payload) {

                    console.log(
                        "Order updated:",
                        payload
                    );

                    loadOrders();

                }
            )
            .on(
                "postgres_changes",
                {
                    event: "DELETE",
                    schema: "public",
                    table: "orders"
                },
                function(payload) {

                    console.log(
                        "Order deleted:",
                        payload
                    );

                    loadOrders();

                }
            )
            .subscribe(
                function(status) {

                    console.log(
                        "Realtime status:",
                        status
                    );

                    if (
                        status === "SUBSCRIBED"
                    ) {

                        setRealtimeStatus(
                            true,
                            "متصل لحظيًا"
                        );

                    } else if (
                        status === "CHANNEL_ERROR" ||
                        status === "TIMED_OUT"
                    ) {

                        setRealtimeStatus(
                            false,
                            "Realtime غير متصل"
                        );

                    }

                }
            );

}


/* ==================================================
   STOP REALTIME
================================================== */

function stopRealtime() {

    if (!realtimeChannel) {
        return;
    }

    supabaseClient.removeChannel(
        realtimeChannel
    );

    realtimeChannel =
        null;

    setRealtimeStatus(
        false,
        "غير متصل"
    );

}


/* ==================================================
   CHECK CURRENT SESSION
================================================== */

async function checkSession() {

    try {

        const result =
            await supabaseClient.auth.getSession();

        const session =
            result.data.session;

        if (!session) {

            showLogin();

            return;

        }

        const isAdmin =
            await checkAdminAccess();

        if (!isAdmin) {

            await supabaseClient.auth.signOut();

            showLogin();

            showLoginError(
                "هذا الحساب ليس لديه صلاحية الدخول إلى لوحة الإدارة."
            );

            return;

        }

        showDashboard();

    } catch (error) {

        console.error(
            "Session Error:",
            error
        );

        showLogin();

    }

}


/* ==================================================
   AUTH STATE
================================================== */

supabaseClient.auth.onAuthStateChange(
    async function(event, session) {

        console.log(
            "Auth event:",
            event
        );

        if (
            session &&
            event !== "SIGNED_OUT"
        ) {

            const isAdmin =
                await checkAdminAccess();

            if (isAdmin) {

                showDashboard();

            } else {

                await supabaseClient.auth.signOut();

                showLogin();

                showLoginError(
                    "هذا الحساب ليس لديه صلاحية الدخول إلى لوحة الإدارة."
                );

            }

        } else {

            stopRealtime();

            allOrders = [];

            showLogin();

        }

    }
);


/* ==================================================
   START
================================================== */

checkSession();

</script>
