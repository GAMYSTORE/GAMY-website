```html
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>سلة المشتريات | GAMY STORE</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            color: #111;
        }

        /* HEADER */

        header {
            background: white;

            padding: 20px 7%;

            display: flex;

            justify-content: space-between;

            align-items: center;

            border-bottom: 1px solid #eee;
        }

        .logo {
            font-size: 27px;

            font-weight: bold;

            letter-spacing: 2px;
        }

        nav {
            display: flex;

            gap: 25px;
        }

        nav a {
            text-decoration: none;

            color: #111;
        }

        .cart-icon {
            font-size: 24px;

            text-decoration: none;

            color: #111;
        }

        /* TITLE */

        .title {
            text-align: center;

            padding: 55px 20px 30px;
        }

        .title h1 {
            font-size: 40px;

            margin-bottom: 10px;
        }

        .title p {
            color: #666;
        }

        /* CART */

        .cart-container {
            width: 86%;

            max-width: 1000px;

            margin: auto;

            padding-bottom: 80px;
        }

        .cart-item {
            background: white;

            margin-bottom: 15px;

            padding: 20px;

            border-radius: 8px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 20px;

            box-shadow: 0 3px 12px rgba(0,0,0,0.06);
        }

        .item-info {
            flex: 1;
        }

        .item-info h3 {
            margin-bottom: 8px;
        }

        .item-info p {
            color: #666;

            margin: 5px 0;
        }

        /* QUANTITY */

        .quantity {
            display: flex;

            align-items: center;

            gap: 10px;
        }

        .quantity button {
            width: 32px;

            height: 32px;

            border: 1px solid #ddd;

            background: white;

            cursor: pointer;

            font-size: 18px;

            border-radius: 4px;

            transition: 0.2s;
        }

        .quantity button:hover {
            background: #111;

            color: white;
        }

        .quantity strong {
            min-width: 25px;

            text-align: center;

            font-size: 16px;
        }

        /* REMOVE */

        .remove {
            border: none;

            background: #111;

            color: white;

            padding: 10px 16px;

            border-radius: 5px;

            cursor: pointer;

            transition: 0.2s;
        }

        .remove:hover {
            background: #333;
        }

        /* TOTAL */

        .total {
            background: white;

            padding: 25px;

            border-radius: 8px;

            margin-top: 25px;

            text-align: center;

            box-shadow: 0 3px 12px rgba(0,0,0,0.06);
        }

        .total h2 {
            margin-bottom: 20px;
        }

        .checkout {
            display: inline-block;

            background: #111;

            color: white;

            text-decoration: none;

            padding: 15px 45px;

            border-radius: 5px;

            transition: 0.2s;
        }

        .checkout:hover {
            background: #333;
        }

        /* EMPTY */

        .empty {
            background: white;

            text-align: center;

            padding: 60px 20px;

            border-radius: 8px;

            color: #666;

            box-shadow: 0 3px 12px rgba(0,0,0,0.06);
        }

        .empty a {
            display: inline-block;

            margin-top: 15px;

            background: #111;

            color: white;

            text-decoration: none;

            padding: 12px 25px;

            border-radius: 5px;
        }

        /* FOOTER */

        footer {
            background: #111;

            color: white;

            text-align: center;

            padding: 40px;
        }

        /* MOBILE */

        @media (max-width: 700px) {

            header {
                padding: 18px 5%;
            }

            .logo {
                font-size: 21px;
            }

            nav {
                gap: 10px;
            }

            nav a {
                font-size: 13px;
            }

            .cart-item {
                flex-direction: column;

                align-items: stretch;

                text-align: center;
            }

            .item-info {
                width: 100%;
            }

            .quantity {
                justify-content: center;
            }

            .remove {
                width: 100%;
            }

            .title {
                padding-top: 40px;
            }

            .title h1 {
                font-size: 32px;
            }

            .checkout {
                width: 100%;
            }

        }

    </style>

</head>


<body>


<header>

    <div class="logo">
        GAMY STORE
    </div>


    <nav>

        <a href="index.html">
            الرئيسية
        </a>

        <a href="products.html">
            المنتجات
        </a>

    </nav>


    <a href="cart.html" class="cart-icon">
        🛒
    </a>

</header>


<section class="title">

    <h1>
        سلة المشتريات
    </h1>

    <p>
        راجع المنتجات قبل إتمام الطلب
    </p>

</section>


<div class="cart-container">

    <div id="cartItems"></div>


    <div class="total">

        <h2>
            الإجمالي:
            <span id="totalPrice">0</span>
            جنيه
        </h2>


        <a
            href="checkout.html"
            class="checkout"
            id="checkoutButton"
        >
            إتمام الطلب
        </a>

    </div>

</div>


<footer>

    <h2>
        GAMY STORE
    </h2>

    <br>

    <p>
        Fashion that defines you.
    </p>

</footer>


<script>

    /* =========================
       قراءة السلة
    ========================= */

    let cart = [];

    try {

        const savedCart =
            localStorage.getItem("gamyCart");

        cart = savedCart
            ? JSON.parse(savedCart)
            : [];

        if (!Array.isArray(cart)) {
            cart = [];
        }

    } catch (error) {

        console.error(
            "خطأ في قراءة السلة:",
            error
        );

        cart = [];

    }


    /* =========================
       عرض السلة
    ========================= */

    function displayCart() {

        const container =
            document.getElementById("cartItems");

        const totalElement =
            document.getElementById("totalPrice");


        if (!container || !totalElement) {
            return;
        }


        container.innerHTML = "";

        let total = 0;


        /* تنظيف البيانات غير الصحيحة */

        cart = cart.filter(function(item) {

            return (
                item &&
                item.name &&
                Number(item.price) >= 0 &&
                Number(item.quantity) > 0
            );

        });


        /* السلة فارغة */

        if (cart.length === 0) {

            container.innerHTML = `

                <div class="empty">

                    <h2>
                        السلة فارغة 🛒
                    </h2>

                    <br>

                    <p>
                        لم تقم بإضافة أي منتجات إلى السلة بعد.
                    </p>

                    <a href="products.html">
                        اذهب للمنتجات
                    </a>

                </div>

            `;

            totalElement.innerText = "0";

            return;
        }


        /* عرض المنتجات */

        cart.forEach(function(item, index) {

            const price =
                Number(item.price) || 0;

            const quantity =
                Number(item.quantity) || 1;

            const itemTotal =
                price * quantity;


            total += itemTotal;


            container.innerHTML += `

                <div class="cart-item">

                    <div class="item-info">

                        <h3>
                            ${escapeHTML(item.name)}
                        </h3>

                        <p>
                            المقاس:
                            ${escapeHTML(item.size || "-")}
                        </p>

                        <p>
                            اللون:
                            ${escapeHTML(item.color || "-")}
                        </p>

                        <p>
                            السعر:
                            ${price}
                            جنيه
                        </p>

                        <p>
                            الإجمالي:
                            <strong>
                                ${itemTotal}
                                جنيه
                            </strong>
                        </p>

                    </div>


                    <div class="quantity">

                        <button
                            type="button"
                            onclick="changeQuantity(${index}, -1)"
                        >
                            -
                        </button>


                        <strong>
                            ${quantity}
                        </strong>


                        <button
                            type="button"
                            onclick="changeQuantity(${index}, 1)"
                        >
                            +
                        </button>

                    </div>


                    <button
                        type="button"
                        class="remove"
                        onclick="removeItem(${index})"
                    >
                        حذف
                    </button>

                </div>

            `;

        });


        totalElement.innerText = total;


        /* حفظ أي تنظيف للبيانات */

        localStorage.setItem(
            "gamyCart",
            JSON.stringify(cart)
        );

    }


    /* =========================
       تغيير الكمية
    ========================= */

    function changeQuantity(index, amount) {

        if (!cart[index]) {
            return;
        }


        const currentQuantity =
            Number(cart[index].quantity) || 1;


        cart[index].quantity =
            currentQuantity + amount;


        if (cart[index].quantity <= 0) {

            cart.splice(index, 1);

        }


        saveCart();

    }


    /* =========================
       حذف منتج
    ========================= */

    function removeItem(index) {

        if (!cart[index]) {
            return;
        }


        cart.splice(index, 1);


        saveCart();

    }


    /* =========================
       حفظ السلة
    ========================= */

    function saveCart() {

        try {

            localStorage.setItem(
                "gamyCart",
                JSON.stringify(cart)
            );

        } catch (error) {

            console.error(
                "خطأ في حفظ السلة:",
                error
            );

            alert(
                "حدث خطأ أثناء تحديث السلة."
            );

            return;

        }


        displayCart();

    }


    /* =========================
       حماية النصوص
    ========================= */

    function escapeHTML(value) {

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    /* =========================
       زر إتمام الطلب
    ========================= */

    const checkoutButton =
        document.getElementById(
            "checkoutButton"
        );


    if (checkoutButton) {

        checkoutButton.addEventListener(
            "click",
            function(event) {

                let currentCart = [];

                try {

                    const savedCart =
                        localStorage.getItem(
                            "gamyCart"
                        );

                    currentCart = savedCart
                        ? JSON.parse(savedCart)
                        : [];

                } catch (error) {

                    currentCart = [];

                }


                if (
                    !Array.isArray(currentCart) ||
                    currentCart.length === 0
                ) {

                    event.preventDefault();

                    alert(
                        "السلة فارغة، أضف منتجًا أولاً 🛒"
                    );

                    return;

                }


                /* السماح بالانتقال إلى checkout.html */

                window.location.href =
                    "checkout.html";

            }
        );

    }


    /* =========================
       تشغيل الصفحة
    ========================= */

    displayCart();

</script>


</body>

</html>
