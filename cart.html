        </div>

            </span>
        </h1>

     CART

<main class="cart-container">

    <div class="section-heading">

        <div>

            <h2>
                سلة المشتريات
            </h2>

            <p>
                راجع اختياراتك قبل إتمام الطلب
            </p>

        </div>

    </div>


    <div id="cartItems"></div>

        <div class="total-info">

            <span>

            </span>

                <span id="totalPrice">0</span>

            href="checkout.html"
            class="checkout"
            id="checkoutButton"
        >

        </a>

    </div>

     FOOTER
========================= -->

    <div class="footer-brand" dir="ltr">

    </div>

        BREAK THROUGH REALITY
    </div>

    <div class="copyright">
        © 2026 HAكـّ — All Rights Reserved
    </div>

</footer>


<script>

    /* =========================
       قراءة السلة
    ========================= */

    let cart = [];

    try {

        const savedCart =
            localStorage.getItem("gamyCart");

        cart = savedCart
            ? JSON.parse(savedCart)
            : [];

        if (!Array.isArray(cart)) {
            cart = [];
        }

    } catch (error) {

        console.error(
            "خطأ في قراءة السلة:",
            error
        );

        cart = [];

    }


    /* =========================
       عرض السلة
    ========================= */

    function displayCart() {

        const container =
            document.getElementById("cartItems");

        const totalElement =
            document.getElementById("totalPrice");


        if (!container || !totalElement) {
            return;
        }


        container.innerHTML = "";

        let total = 0;


        /* تنظيف البيانات غير الصحيحة */

        cart = cart.filter(function(item) {

            return (
                item &&
                item.name &&
                Number(item.price) >= 0 &&
                Number(item.quantity) > 0
            );

        });


        /* السلة فارغة */

        if (cart.length === 0) {

            container.innerHTML = `

                <div class="empty">

                    <div class="empty-icon">
                        🛒
                    </div>

                    <h2>
                        السلة فارغة
                    </h2>

                    <p>
                        لم تقم بإضافة أي منتجات إلى السلة بعد.
                    </p>

                    <a href="products.html">
                        اكتشف المنتجات
                    </a>

                </div>

            `;

            totalElement.innerText = "0";

            return;
        }


        /* عرض المنتجات */

        cart.forEach(function(item, index) {

            const price =
                Number(item.price) || 0;

            const quantity =
                Number(item.quantity) || 1;

            const itemTotal =
                price * quantity;


            total += itemTotal;


            container.innerHTML += `

                <article class="cart-item">

                    <div class="item-info">

                        <h3>
                            ${escapeHTML(item.name)}
                        </h3>

                        <div class="item-details">

                            <span class="detail">
                                المقاس:
                                <strong>
                                    ${escapeHTML(item.size || "-")}
                                </strong>
                            </span>

                            <span class="detail">
                                اللون:
                                <strong>
                                    ${escapeHTML(item.color || "-")}
                                </strong>
                            </span>

                        </div>

                        <div class="item-price">
                            سعر القطعة:
                            ${price}
                            جنيه
                        </div>

                        <div class="item-total">
                            الإجمالي:
                            ${itemTotal}
                            جنيه
                        </div>

                    </div>


                    <div class="quantity-box">

                        <div class="quantity-label">
                            QUANTITY
                        </div>

                        <div class="quantity">

                            <button
                                type="button"
                                onclick="changeQuantity(${index}, -1)"
                                aria-label="تقليل الكمية"
                            >
                                −
                            </button>

                            <strong>
                                ${quantity}
                            </strong>

                            <button
                                type="button"
                                onclick="changeQuantity(${index}, 1)"
                                aria-label="زيادة الكمية"
                            >
                                +
                            </button>

                        </div>

                    </div>


                    <button
                        type="button"
                        class="remove"
                        onclick="removeItem(${index})"
                    >
                        حذف المنتج
                    </button>

                </article>

            `;

        });


        totalElement.innerText =
            total.toLocaleString("en-US");


        /* حفظ أي تنظيف للبيانات */

        localStorage.setItem(
            "gamyCart",
            JSON.stringify(cart)
        );

    }


    /* =========================
       تغيير الكمية
    ========================= */

    function changeQuantity(index, amount) {

        if (!cart[index]) {
            return;
        }


        const currentQuantity =
            Number(cart[index].quantity) || 1;


        cart[index].quantity =
            currentQuantity + amount;


        if (cart[index].quantity <= 0) {

            cart.splice(index, 1);

        }


        saveCart();

    }


    /* =========================
       حذف منتج
    ========================= */

    function removeItem(index) {

        if (!cart[index]) {
            return;
        }


        cart.splice(index, 1);


        saveCart();

    }


    /* =========================
       حفظ السلة
    ========================= */

    function saveCart() {

        try {

            localStorage.setItem(
                "gamyCart",
                JSON.stringify(cart)
            );

        } catch (error) {

            console.error(
                "خطأ في حفظ السلة:",
                error
            );

            alert(
                "حدث خطأ أثناء تحديث السلة."
            );

            return;

        }


        displayCart();

    }


    /* =========================
       حماية النصوص
    ========================= */

    function escapeHTML(value) {

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    /* =========================
       زر إتمام الطلب
    ========================= */

    const checkoutButton =
        document.getElementById(
            "checkoutButton"
        );


    if (checkoutButton) {

        checkoutButton.addEventListener(
            "click",
            function(event) {

                let currentCart = [];

                try {

                    const savedCart =
                        localStorage.getItem(
                            "gamyCart"
                        );

                    currentCart = savedCart
                        ? JSON.parse(savedCart)
                        : [];

                } catch (error) {

                    currentCart = [];

                }


                if (
                    !Array.isArray(currentCart) ||
                    currentCart.length === 0
                ) {

                    event.preventDefault();

                    alert(
                        "السلة فارغة، أضف منتجًا أولاً 🛒"
                    );

                    return;

                }


                window.location.href =
                    "checkout.html";

            }
        );

    }


    /* =========================
       تشغيل الصفحة
    ========================= */

    displayCart();

</script>


</body>

</html>
