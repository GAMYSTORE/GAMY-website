<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>منتجات | GAMY STORE</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            font-family: Arial, sans-serif;

            background: #f8f8f8;

            color: #111;
        }


        /* ================= HEADER ================= */

        header {
            background: white;

            padding: 20px 7%;

            display: flex;

            justify-content: space-between;

            align-items: center;

            border-bottom: 1px solid #eee;

            position: sticky;

            top: 0;

            z-index: 1000;
        }


        .logo {
            font-size: 27px;

            font-weight: bold;

            letter-spacing: 2px;
        }


        nav {
            display: flex;

            gap: 25px;
        }


        nav a {
            text-decoration: none;

            color: #111;

            font-size: 16px;
        }


        nav a:hover {
            color: #777;
        }


        .cart {
            text-decoration: none;

            color: #111;

            font-size: 23px;

            position: relative;
        }


        #cartCount {

            position: absolute;

            top: -10px;

            right: -12px;

            background: #111;

            color: white;

            width: 20px;

            height: 20px;

            border-radius: 50%;

            font-size: 12px;

            display: flex;

            align-items: center;

            justify-content: center;
        }


        /* ================= PAGE TITLE ================= */

        .page-title {

            text-align: center;

            padding: 60px 20px 35px;
        }


        .page-title h1 {

            font-size: 42px;

            margin-bottom: 12px;
        }


        .page-title p {

            color: #666;

            font-size: 17px;
        }


        /* ================= PRODUCTS ================= */

        .products-container {

            width: 86%;

            max-width: 1400px;

            margin: auto;

            display: grid;

            grid-template-columns: repeat(4, 1fr);

            gap: 25px;

            padding-bottom: 80px;
        }


        /* ================= PRODUCT ================= */

        .product {

            background: white;

            border-radius: 8px;

            overflow: hidden;

            box-shadow:
                0 3px 15px rgba(0,0,0,0.08);

            transition: 0.3s;
        }


        .product:hover {

            transform: translateY(-6px);

            box-shadow:
                0 8px 25px rgba(0,0,0,0.12);
        }


        .product-image {

            width: 100%;

            height: 300px;

            object-fit: cover;

            display: block;
        }


        .product-info {

            padding: 20px;
        }


        .product-name {

            font-size: 19px;

            font-weight: bold;

            margin-bottom: 10px;
        }


        .price {

            font-size: 19px;

            font-weight: bold;

            margin-bottom: 18px;
        }


        /* ================= OPTIONS ================= */

        .option {

            margin-bottom: 15px;
        }


        .option label {

            display: block;

            font-size: 14px;

            font-weight: bold;

            margin-bottom: 7px;
        }


        select {

            width: 100%;

            padding: 11px;

            border: 1px solid #ddd;

            border-radius: 5px;

            background: white;

            font-size: 14px;

            cursor: pointer;
        }


        /* ================= BUTTON ================= */

        .add-cart {

            width: 100%;

            padding: 14px;

            border: none;

            background: #111;

            color: white;

            font-size: 15px;

            font-weight: bold;

            border-radius: 5px;

            cursor: pointer;

            transition: 0.3s;
        }


        .add-cart:hover {

            background: #333;
        }


        .add-cart.added {

            background: #555;
        }


        /* ================= FOOTER ================= */

        footer {

            background: #111;

            color: white;

            text-align: center;

            padding: 40px 20px;
        }


        footer h2 {

            margin-bottom: 10px;
        }


        footer p {

            color: #bbb;
        }


        /* ================= TABLET ================= */

        @media (max-width: 1100px) {

            .products-container {

                grid-template-columns:
                    repeat(3, 1fr);
            }

        }


        /* ================= MOBILE ================= */

        @media (max-width: 800px) {

            header {

                padding: 15px 5%;
            }


            .logo {

                font-size: 21px;
            }


            nav {

                gap: 12px;
            }


            nav a {

                font-size: 13px;
            }


            .products-container {

                grid-template-columns:
                    repeat(2, 1fr);

                width: 92%;

                gap: 15px;
            }


            .product-image {

                height: 250px;
            }

        }


        /* ================= SMALL MOBILE ================= */

        @media (max-width: 500px) {

            header {

                flex-wrap: wrap;

                gap: 15px;
            }


            nav {

                order: 3;

                width: 100%;

                justify-content: center;
            }


            .products-container {

                grid-template-columns: 1fr;
            }


            .product-image {

                height: 350px;
            }


            .page-title h1 {

                font-size: 32px;
            }

        }

    </style>

</head>


<body>
