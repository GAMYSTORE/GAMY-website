<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAMY STORE - Clothes without excess</title>
    <style>
        /* --- الأساسيات --- */
        :root {
            --primary-color: #111;
            --text-color: #333;
            --bg-color: #fff;
            --overlay-color: rgba(0, 0, 0, 0.4);
            --box-bg: rgba(255, 255, 255, 0.85);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
        }

        a {
            text-decoration: none;
            color: inherit;
            transition: 0.3s;
        }

        /* --- الهيدر (Header) --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            background-color: var(--bg-color);
            border-bottom: 1px solid #eee;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
        }

        .cart-icon {
            font-size: 20px;
            cursor: pointer;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 25px;
        }

        nav a {
            font-size: 15px;
            font-weight: 500;
        }

        nav a:hover {
            color: #888;
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* --- قسم البانر الرئيسي (Hero Section) --- */
        .hero {
            height: 100vh;
            margin-top: 70px; /* للتعويض عن الهيدر الثابت */
            position: relative;
            background-color: #f4f4f4; /* لون خلفية احتياطي */
        }

        /* خلفية الصورة - مدمجة نصياً */
        .hero-image-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
